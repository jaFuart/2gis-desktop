name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: Windows-x64
          - runner: macos-15
            platform: macOS-Apple-Silicon
          - runner: macos-15-intel
            platform: macOS-Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m unittest discover -s tests -v
      - run: python build.py
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist/2GIS-Export' -DestinationPath '2GIS-Export-Windows-x64.zip'
      - name: Archive macOS package
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/2GIS-Export.app "2GIS-Export-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: 2GIS-Export-${{ matrix.platform }}
          path: 2GIS-Export-${{ matrix.platform }}.zip
          if-no-files-found: error
